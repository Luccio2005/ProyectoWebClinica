<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Clínica Raíz: servicios médicos, especialidades y farmacia.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Raíz - Inicio</title>
    <script>
        /* Oculta los anuncios cuando la pantalla es estrecha. */
        function adaptarMarcos() {
            var estructura = document.getElementById("estructura-principal");
            if (window.innerWidth <= 650) {
                estructura.setAttribute("cols", "100%,0%");
            } else {
                estructura.setAttribute("cols", "82%,18%");
            }
        }

        window.addEventListener("load", adaptarMarcos);
        window.addEventListener("resize", adaptarMarcos);
    </script>
</head>
<frameset id="estructura-principal" cols="82%,18%" frameborder="0" border="0" framespacing="0">
    <frame src="inicio-clinica.html" name="contenido" title="Página principal de Clínica Raíz">
    <frameset rows="50%,50%" frameborder="0" border="0" framespacing="0">
        <frame src="anuncio1.html" name="anuncioSuperior" title="Anuncio superior" scrolling="auto">
        <frame src="anuncio2.html" name="anuncioInferior" title="Anuncio inferior" scrolling="auto">
    </frameset>
    <noframes>
        <body>
            <p>Tu navegador no admite frames. <a href="inicio-clinica.html">Abrir la página de Clínica Raíz</a>.</p>
        </body>
    </noframes>
</frameset>
</html>
